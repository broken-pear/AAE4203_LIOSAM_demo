# =============================================================================
# S0 —— 名义工况（baseline condition）
#
# 就是 demo 原本的动作：半径 1.25 m 的匀速圆，v = 0.40 m/s，ω = 0.32 rad/s。
# 12×12 m 房间 + 中央方柱 + 四个方墩，几何特征充足、运动平缓。
# 这一组是"两条算法都觉得舒服"的条件，用来确认：
#   * 差异不是人为制造的 —— 在好条件下两者都该收敛
#   * LIO-SAM 的优势在这里可能只有几个百分点，真正的差距在 S1/S3
#
# 90 s ≈ 4.6 圈，36 m 行程。
# =============================================================================
scripted_driver:
  ros__parameters:
    rate_hz: 20.0
    ramp_time: 1.5
    hold_final: true
    linear_speed: [0.40]
    angular_speed: [0.32]
    duration: [90.0]

scenario:
  name: s0_nominal
  world: lab1_room.sdf
  description: 名义工况：r=1.25 m 匀速圆，几何充足
  record_seconds: 102.0
