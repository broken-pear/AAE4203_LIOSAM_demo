# =============================================================================
# S3 —— 长走廊（几何退化）★ 最重要的一组
#
# 场景换成长 30 m、宽 3 m 的走廊（worlds/corridor.sdf）。
# 动作：直行 12 s（7.2 m）→ 原地掉头 180°（2 s @ 1.57 rad/s）→ 直行 12 s → 再掉头，
#       共 2 个来回 = 56 s。
#
# 为什么这一组最能说明问题：
#   走廊里的观测几乎全是"沿墙的长平面"。沿走廊方向（x）和航向（yaw）
#   在 scan-to-map 的雅可比里接近奇异 —— 几何本身提供不了这两个自由度。
#   LOAM 迭代到退化方向时，修正量只能来自初值，误差沿 x 和 yaw 单调累积；
#   LIO-SAM 那一瞬间仍有 IMU 预积分因子把 x/yaw 钉住（短时加速度/角速度很准），
#   所以能撑住。
#
# 预期结果：
#   LOAM 的 ATE 会明显大于 S0（差一个量级不奇怪），终点 yaw 误差也会有几十度
#   LIO-SAM 的 ATE 应该和 S0 同量级
#
# ⚠️ 走廊宽 3 m，车宽约 0.4 m，掉头时两头各剩 1.3 m，正常情况下够；
#    如果 Gazebo 里出现碰撞（/gt/odom 突然跳），把 v 调小或把掉头改成圆弧。
# =============================================================================
scripted_driver:
  ros__parameters:
    rate_hz: 20.0
    ramp_time: 1.5
    hold_final: true
    linear_speed: [0.6, 0.0, 0.6, 0.0, 0.6, 0.0, 0.6, 0.0]
    angular_speed: [0.0, 1.5708, 0.0, 1.5708, 0.0, 1.5708, 0.0, 1.5708]
    duration: [12.0, 2.0, 12.0, 2.0, 12.0, 2.0, 12.0, 2.0]

scenario:
  name: s3_corridor
  world: corridor.sdf
  description: 长走廊几何退化：30x3 m，沿轴往返 2 个来回
  record_seconds: 68.0
