# =============================================================================
# S1 —— 高角速度（急转）
#
# v = 0.45 m/s，ω = 0.90 rad/s → 转弯半径 0.5 m，60 s。
#
# 这一组专门打"运动畸变"：
#   激光雷达转一圈 0.1 s，这 0.1 s 里车头转了 0.09 rad ≈ 5.2°。
#   一帧点云里"最早打的点"和"最晚打的点"差了 5°，10 m 处的墙上
#   就是 0.9 m 的位置错位 —— 不去畸变的话，整帧会被"抹"成一段弧。
#
# 预期结果：
#   LIO-SAM 用 IMU 插值把每个点搬回同一时刻，误差基本不随 ω 增大而恶化
#   LOAM 没有 time 字段可用（A-LOAM 的 DISTORTION 宏是 0），误差随 ω 线性上升
#
# 这就是报告里"角速度越高，LIO-SAM 相对更精确"的直接证据。
# =============================================================================
scripted_driver:
  ros__parameters:
    rate_hz: 20.0
    ramp_time: 1.5
    hold_final: true
    linear_speed: [0.45]
    angular_speed: [0.90]
    duration: [60.0]

scenario:
  name: s1_fast_yaw
  world: lab1_room.sdf
  description: 高角速度：ω=0.90 rad/s（每帧转 5.2°），畸变主导
  record_seconds: 72.0
