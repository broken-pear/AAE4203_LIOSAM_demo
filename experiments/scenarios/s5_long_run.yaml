# =============================================================================
# S5 —— 长时运行（漂移累积）
#
# 和 S0 完全一样的动作，只是跑 180 s（约 9 圈，72 m）。
#
# 目的：把"每帧误差"和"累积误差"分开。
#   S0 看的是局部精度；S5 看的是 3 分钟之后还在不在轨道上。
#   两条算法都**没有开回环**（LIO-SAM 的 loopClosureEnableFlag 是 false），
#   所以这一组是纯粹的里程计漂移对比，对两者都公平。
#
# ⚠️ 180 s 在 Jetson 上录制 + 两次回放，大约要 10~12 分钟。
#    时间紧的话先用 S0–S4，把 S5 放到最后跑。
# =============================================================================
scripted_driver:
  ros__parameters:
    rate_hz: 20.0
    ramp_time: 1.5
    hold_final: true
    linear_speed: [0.40]
    angular_speed: [0.32]
    duration: [180.0]

scenario:
  ros__parameters:
    name: s5_long_run
    world: lab1_room.sdf
    description: 长时运行：S0 的动作跑 180 s（9 圈），看累积漂移
    record_seconds: 192.0
