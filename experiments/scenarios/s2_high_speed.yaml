# =============================================================================
# S2 —— 高线速度（高速直行 + 直角弯）
#
# 2.4 m × 2.4 m 的方框，直道 1.2 m/s，每个角原地左转 90°（1 s @ 1.57 rad/s），
# 跑 5 圈（60 s），行程约 48 m。
#
# 这一组打的是"平移畸变"和"帧间位移过大"：
#   一帧 0.1 s 内车走了 0.12 m。scan-to-scan 的初始位姿猜得越差，
#   角点/面点的最近邻就越容易配错（A-LOAM 用 DISTANCE_SQ_THRESHOLD = 25 即 5 m
#   做门限，速度大了以后配错率上升）。
#
# 预期结果：
#   LIO-SAM 用 IMU 预积分给的初值，帧间位移再大也能把对应关系拉回来
#   LOAM 的误差随速度上升更快
# =============================================================================
scripted_driver:
  ros__parameters:
    rate_hz: 20.0
    ramp_time: 1.5
    hold_final: true
    # 直道 2 s (2.4 m) + 原地左转 1 s (90°)  × 4，重复 5 圈
    linear_speed: [1.2, 0.0, 1.2, 0.0, 1.2, 0.0, 1.2, 0.0,
                   1.2, 0.0, 1.2, 0.0, 1.2, 0.0, 1.2, 0.0,
                   1.2, 0.0, 1.2, 0.0, 1.2, 0.0, 1.2, 0.0,
                   1.2, 0.0, 1.2, 0.0, 1.2, 0.0, 1.2, 0.0,
                   1.2, 0.0, 1.2, 0.0, 1.2, 0.0, 1.2, 0.0]
    angular_speed: [0.0, 1.5708, 0.0, 1.5708, 0.0, 1.5708, 0.0, 1.5708,
                    0.0, 1.5708, 0.0, 1.5708, 0.0, 1.5708, 0.0, 1.5708,
                    0.0, 1.5708, 0.0, 1.5708, 0.0, 1.5708, 0.0, 1.5708,
                    0.0, 1.5708, 0.0, 1.5708, 0.0, 1.5708, 0.0, 1.5708,
                    0.0, 1.5708, 0.0, 1.5708, 0.0, 1.5708, 0.0, 1.5708]
    duration: [2.0, 1.0, 2.0, 1.0, 2.0, 1.0, 2.0, 1.0,
               2.0, 1.0, 2.0, 1.0, 2.0, 1.0, 2.0, 1.0,
               2.0, 1.0, 2.0, 1.0, 2.0, 1.0, 2.0, 1.0,
               2.0, 1.0, 2.0, 1.0, 2.0, 1.0, 2.0, 1.0,
               2.0, 1.0, 2.0, 1.0, 2.0, 1.0, 2.0, 1.0]

scenario:
  name: s2_high_speed
  world: lab1_room.sdf
  description: 高速：1.2 m/s 直道 + 90 度原地转，5 圈方框
  record_seconds: 72.0
